version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12.3"
    container_name: rif-runtime-server-prod
    restart: always
    environment:
      RIF_LOG_LEVEL: "INFO"
      RIF_SERVER_WORKERS: "4"
      RIF_SECURITY_SANDBOX_MODE: "strict"
      RIF_POLICY_AUTO_RELOAD: "true"
    ports:
      - "8000:8000"
    volumes:
      - rif-data:/app/data
      - rif-config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rif-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

