# Production-oriented Compose overlay for the governance MVP image.
#   docker compose -f docker-compose.prod.yml up -d --build
# Does not add Postgres/Redis — MVP persists to JSONL under /app/data.
# OS hardening below is *deployer* Compose options; the Python package itself
# does not implement seccomp sandboxing (SECURITY.md).

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12.3"
    image: rif-runtime:${RIF_IMAGE_TAG:-v1.0.0}
    container_name: rif-runtime-server-prod
    restart: always
    ports:
      - "${RIF_HOST_PORT:-8000}:8000"
    environment:
      RIF_CONTROL_PLANE_API_KEYS: ${RIF_CONTROL_PLANE_API_KEYS:?set RIF_CONTROL_PLANE_API_KEYS}
      RIF_CORS_ORIGINS: ${RIF_CORS_ORIGINS:-}
      RIF_DATA_DIR: data
      RIF_CONFIG_DIR: config
    env_file:
      - path: .env
        required: false
    volumes:
      - rif-data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 2.0
    networks:
      - rif-network

volumes:
  rif-data:
    driver: local

networks:
  rif-network:
    driver: bridge
