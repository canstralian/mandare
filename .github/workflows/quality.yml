name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ruff-mypy-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          # ruff pinned: unpinned installs pull 0.16.0, which re-sorts imports
          # and enables new lints, turning main red with no code change.
          pip install ruff==0.15.22 mypy pytest

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/rif_runtime --ignore-missing-imports
      - run: pytest
