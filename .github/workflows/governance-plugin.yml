name: Governance plugin

on:
  pull_request:
    paths: ['plugins/mandare-governance/**', '.claude-plugin/**', '.github/workflows/governance-plugin.yml']
  push:
    branches: [main]
    paths: ['plugins/mandare-governance/**', '.claude-plugin/**', '.github/workflows/governance-plugin.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned: plugin tests run against this build's function-hooks API. Bump deliberately.
      - run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.292
      - run: claude plugin validate .
      - run: claude plugin validate plugins/mandare-governance
      - run: claude plugin test plugins/mandare-governance
