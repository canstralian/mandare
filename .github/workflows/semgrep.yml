name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: semgrep-security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin to full commit SHAs so p/github-actions mutable-tag rules do not
      # flag this workflow, and so tags cannot be silently retargeted.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Verify findings fail the scanner
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix='semgrep-enforcement-') as directory:
              fixture = Path(directory) / 'workflow.yml'
              output = Path(directory) / 'findings.json'
              fixture.write_text(
                  'jobs:\n  probe:\n    steps:\n'
                  '      - uses: actions/checkout@v4\n'
                  '      - run: echo "' + '::'.join(['', 'add-mask', 'synthetic-nonce']) + '"\n'
              )
              result = subprocess.run([
                  'semgrep', 'scan', '--config=p/python', '--config=p/security-audit',
                  '--config=p/secrets', '--config=p/github-actions', '--error',
                  '--json', '--output=' + str(output), str(fixture),
              ], check=False)
              if result.returncode != 1:
                  raise SystemExit('Expected finding exit status 1, got ' + str(result.returncode))
              rules = {finding['check_id'] for finding in json.loads(output.read_text())['results']}
              for expected in ['github-actions-mutable-action-tag', 'unsafe-add-mask-workflow-command']:
                  if not any(rule.endswith('.' + expected) for rule in rules):
                      raise SystemExit('Missing expected enforcement finding: ' + expected)
              print('Verified: mutable references and unreviewed mask commands still fail scanning')
          PY

      # Use the CLI (not semgrep/semgrep-action@v1): that action rejects
      # generateSarif and does not emit semgrep.sarif for upload.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/github-actions \
            --error \
            --sarif \
            --output=semgrep.sarif

      - name: Summarize Semgrep findings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('semgrep.sarif').read_text())
          findings = []
          for run in report.get('runs', []):
              for result in run.get('results', []):
                  for location in result.get('locations', []):
                      physical = location.get('physicalLocation', {})
                      findings.append({
                          'rule': result.get('ruleId'),
                          'level': result.get('level'),
                          'path': physical.get('artifactLocation', {}).get('uri'),
                          'line': physical.get('region', {}).get('startLine'),
                          'suppressions': result.get('suppressions', []),
                      })
          print(json.dumps({'finding_locations': findings}, indent=2))
          PY

      - name: Retain Semgrep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
