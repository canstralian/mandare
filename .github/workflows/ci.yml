name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pip install -e . must precede pytest: test_version.py asserts that
      # importlib.metadata.version("rif-runtime") matches pyproject.toml.
      - run: pip install -e .
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: mypy src/rif_runtime --ignore-missing-imports
      - run: pytest -q
