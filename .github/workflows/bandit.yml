name: Bandit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read  # required by upload-sarif to read workflow run metadata

jobs:
  bandit:
    name: bandit-sarif
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # bandit-sarif-formatter 1.1.1 is verified compatible with bandit 1.9.4
      - run: python -m pip install --upgrade pip "bandit[toml]==1.9.4" "bandit-sarif-formatter==1.1.1"

      - run: bandit -r src -f sarif -o bandit.sarif

      - name: Validate SARIF is well-formed and non-empty
        run: test -s bandit.sarif && jq . bandit.sarif > /dev/null

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif
