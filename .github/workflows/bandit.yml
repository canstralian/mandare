name: Bandit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read  # required by upload-sarif to read workflow run metadata

jobs:
  bandit:
    name: bandit-sarif
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # [toml] extra enables pyproject.toml-based bandit config if added later
      # bandit-sarif-formatter pinned for SARIF schema compatibility; bandit floats to pick up security fixes
      - run: python -m pip install --upgrade pip "bandit[toml]" "bandit-sarif-formatter==1.1.1"

      - run: bandit -r src -f sarif -o bandit.sarif

      # jq is pre-installed on GitHub-hosted ubuntu runners; runs even when bandit exits 1 (findings found)
      - name: Validate SARIF is well-formed and non-empty
        if: always()
        run: test -s bandit.sarif && jq . bandit.sarif > /dev/null

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif
