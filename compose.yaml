# RIF Runtime — governance MVP (no DB, no Metasploit execution).
# Usage:
#   cp .env.example .env   # set RIF_CONTROL_PLANE_API_KEYS
#   docker compose up --build
# Secrets must come from the environment / .env — never bake keys into the image.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12.3"
    image: rif-runtime:local
    container_name: rif-runtime-server
    restart: unless-stopped
    ports:
      - "${RIF_HOST_PORT:-8000}:8000"
    environment:
      RIF_CONTROL_PLANE_API_KEYS: ${RIF_CONTROL_PLANE_API_KEYS:?set RIF_CONTROL_PLANE_API_KEYS in .env}
      RIF_CORS_ORIGINS: ${RIF_CORS_ORIGINS:-http://localhost:3000}
      RIF_DATA_DIR: data
      RIF_CONFIG_DIR: config
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist JSONL (decisions, posture) + policies.json — restrict host perms (SECURITY.md).
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only rootfs; JSONL writes go to the data volume; tmp for runtime scratch.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Compose v2 non-Swarm: use these; deploy.resources is ignored outside Swarm.
    mem_limit: 512m
    cpus: 1.0
    networks:
      - rif-network

networks:
  rif-network:
    driver: bridge
