services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mandare:main
    ports:
      - "8000:8000"
    restart: unless-stopped
  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: mandare:dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      HOME: /home/rifdev
    command: ["bash"]
    stdin_open: true
    tty: true
