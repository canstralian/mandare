[build-system]
requires=['setuptools']
build-backend='setuptools.build_meta'

[project]
name='rif-runtime'
# Bump with: scripts/bump-version.sh X.Y.Z
version='0.3.0rc1'
dependencies=['fastapi','uvicorn[standard]','pydantic','pyyaml','networkx','typer','rich','httpx','cryptography']

[project.optional-dependencies]
dev=['pytest','httpx','ruff==0.15.22','mypy','types-PyYAML','jsonschema[format]']

[project.scripts]
rif='rif_runtime.cli:app'

[tool.setuptools.packages.find]
where=['src']

[tool.mypy]
# Annotations on the runtime package are enforced, not advisory: without this
# mypy skips the bodies of unannotated functions entirely, so an untyped
# module silently opts out of checking.
disallow_untyped_defs=true
warn_unused_ignores=true
warn_redundant_casts=true
