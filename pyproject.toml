[build-system]
requires=['setuptools']
build-backend='setuptools.build_meta'

[project]
name='rif-runtime'
version='0.2.2'
dependencies=['fastapi','uvicorn[standard]','pydantic','pyyaml','networkx','typer','rich','httpx','cryptography']

[project.optional-dependencies]
dev=['pytest','httpx','ruff','mypy','types-PyYAML','jsonschema[format]']

[project.scripts]
rif='rif_runtime.cli:app'

[tool.setuptools.packages.find]
where=['src']
