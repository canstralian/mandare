[build-system]
requires=['setuptools']
build-backend='setuptools.build_meta'

[project]
name='rif-runtime'
# Bump with: scripts/bump-version.sh X.Y.Z
version='0.3.0rc1'
dependencies=['fastapi','uvicorn[standard]','pydantic','pyyaml','networkx','typer','rich','httpx','cryptography']

[project.optional-dependencies]
dev=['pytest','httpx','ruff==0.15.22','mypy','types-PyYAML','jsonschema[format]']

[project.scripts]
rif='rif_runtime.cli:app'

[tool.setuptools.packages.find]
where=['src']

[tool.pytest.ini_options]
# Confine root test collection to the rif_runtime suite. The self-contained
# workflow-automation/ subproject ships its own pyproject + tests and is run from
# within that directory (see workflow-automation/README.md); keeping it out of the
# root run means the root CI does not need the `wfa` package installed.
testpaths=['tests']
