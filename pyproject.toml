[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mandare"
version = "0.3.0rc2"
description = "Governed execution substrate for intelligent systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Stephen de Jager" }
]
keywords = [
    "ai",
    "runtime",
    "governance",
    "policy",
    "evidence",
    "replay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "networkx",
    "typer",
    "rich",
    "httpx",
    "cryptography",
]

[project.optional-dependencies]
supabase = [
    "supabase>=2.0,<3.0",
]
mcp = [
    "mcp>=2,<3",
]
# Single source of truth for the development toolchain. `requirements/dev.txt`
# is compiled from this extra with `--generate-hashes`; every CI job installs
# that lock, so no two jobs can resolve a different toolchain.
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=7.1,<8.0",
    "mypy>=1.18,<2.0",
    "ruff>=0.15,<0.16",
    "jsonschema[format]>=4.25,<5.0",
    "rfc3339-validator>=0.1.4,<0.2",
    "types-PyYAML>=6.0,<7.0",
    "build>=1.3,<2.0",
    "wheel>=0.45,<1.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
]

[project.scripts]
rif = "rif_runtime.cli:app"
mandare-mcp-github = "rif_runtime.mcp.github:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.rif_runtime.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
